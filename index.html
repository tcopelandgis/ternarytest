<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Folk Sediment Diagram</title>

<style>
:root {
  --ink:#1f2c31;
  --muted:#5a6a70;
  --panel:#f8faf9;
  --accent:#2a6b65;
  --warn:#b4532a;
}

* {
  box-sizing:border-box;
}

html, body {
  margin:0;
  background:var(--panel);
  color:var(--ink);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}

.wrap {
  max-width:1100px;
  margin:0 auto;
  padding:12px 14px 18px;
}

.top {
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:4px 12px;
}

h1 {
  font-size:17px;
  margin:0;
}

#where {
  color:var(--muted);
  font-size:12.5px;
}

.grid {
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:14px;
  margin-top:10px;
  align-items:start;
}

@media (max-width:760px) {
  .grid {
    grid-template-columns:1fr;
  }
}

.tabs {
  display:flex;
  gap:6px;
  margin-bottom:6px;
}

.tabs button {
  flex:1;
  font:inherit;
  font-weight:600;
  padding:6px 8px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  border-radius:6px;
  cursor:pointer;
}

.tabs button.on {
  background:var(--accent);
  color:#fff;
}

button:focus-visible,
input:focus-visible {
  outline:2px solid var(--warn);
  outline-offset:2px;
}

#count {
  color:#44545a;
  font-size:13px;
  min-height:1.4em;
}

#count.err {
  color:var(--warn);
}

svg#tern {
  width:100%;
  height:auto;
  display:block;
}

.region {
  fill-opacity:.45;
  stroke:none;
}

.edge {
  fill:none;
  stroke:#2f4148;
  stroke-width:1.6;
}

.bnd {
  stroke:#2f4148;
  stroke-width:1;
  opacity:.75;
}

.cls {
  fill:var(--ink);
  font-size:13px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  paint-order:stroke;
  stroke:rgba(255,255,255,.85);
  stroke-width:3px;
}

.cls.sm {
  font-size:10.5px;
}

.tick {
  fill:#6a787d;
  font-size:11px;
}

.corner {
  fill:var(--ink);
  font-size:14px;
  font-weight:600;
}

.pt {
  stroke:rgba(0,0,0,.75);
  stroke-width:.8;
  cursor:pointer;
}

.pt.sel {
  stroke:#000;
  stroke-width:2.4;
}

.side > * + * {
  margin-top:12px;
}

.box {
  background:#fff;
  border:1px solid #d6dedc;
  border-radius:8px;
  padding:10px 12px;
}

.box h2 {
  font-size:13px;
  margin:0 0 6px;
}

label.row {
  display:block;
  font-size:13px;
  margin:6px 0;
}

#info {
  font-size:13px;
  min-height:5em;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <h1>Folk classification of usSEABED samples</h1>
    <span id="where"></span>
  </div>

  <div class="grid">

    <div>
      <div class="tabs">
        <button id="tGSM" class="on" type="button">
          Gravel – sand – mud
        </button>

        <button id="tSSC" type="button">
          Sand – silt – clay
        </button>
      </div>

      <div id="count" role="status">Loading samples…</div>

      <svg
        id="tern"
        viewBox="0 0 600 530"
        role="img"
        aria-label="Folk ternary diagram">
      </svg>
    </div>

    <div class="side">
      <div class="box" id="info">
        Hover over a point for its details.
      </div>

      <div class="box">
        <h2>Display</h2>

        <label class="row">
          <input type="checkbox" id="onlyBad">
          Only samples whose code disagrees with their percentages
        </label>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= SETTINGS ================= */

  const LAYER_URL =
    "https://services5.arcgis.com/7weheFjxuNkGGiZi/ArcGIS/rest/services/usSEABED_Integrated_Sea-Floor-Characterization_Database_view/FeatureServer/4";

  const FIELDS =
    "OBJECTID,Gravel,Sand,Mud,Clay,FolkCde,LocnName,WaterDepth,DataTypes,ObsvnDate";

  const PAGE = 2000;
  const MAX_FETCH = 20000;

  /*
    These dimensions must represent the Experience Builder
    Map widget, not the Embed widget.
  */
  const MAP_WIDTH_PX = 943;
  const MAP_HEIGHT_PX = 887;

  const SCREEN_DPI = 96;
  const INCHES_PER_METER = 39.37;
  const WEB_MERCATOR_RADIUS = 6378137;

  /* ================= URL INPUT ================= */

  const params = new URLSearchParams(window.location.search);

  function safelyDecode(value) {
    if (!value) return value;

    try {
      return decodeURIComponent(value);
    } catch (error) {
      return value;
    }
  }

  function parseExtent(text) {
    if (!text) return null;

    const values = safelyDecode(String(text))
      .split(",")
      .map(value => Number(value.trim()));

    if (
      values.length < 4 ||
      values.slice(0, 4).some(value => !Number.isFinite(value))
    ) {
      return null;
    }

    const wkid =
      values.length >= 5 && Number.isFinite(values[4])
        ? Math.round(values[4])
        : 4326;

    let xmin = Math.min(values[0], values[2]);
    let ymin = Math.min(values[1], values[3]);
    let xmax = Math.max(values[0], values[2]);
    let ymax = Math.max(values[1], values[3]);

    const geographic =
      wkid === 4326 ||
      wkid === 4269 ||
      wkid === 4267;

    const pad = geographic ? 0.01 : 1000;

    if (xmin === xmax) {
      xmin -= pad;
      xmax += pad;
    }

    if (ymin === ymax) {
      ymin -= pad;
      ymax += pad;
    }

    return {
      xmin,
      ymin,
      xmax,
      ymax,
      wkid,
      source: "extent"
    };
  }

  function parseMapState(text) {
    if (!text) return null;

    let decoded = String(text);

    if (
      decoded.includes("%2C") ||
      decoded.includes("%3A") ||
      decoded.includes("%7B")
    ) {
      decoded = safelyDecode(decoded);
    }

    const centerMatch = decoded.match(
      /(?:^|,)center:([^,]+),([^,]+),([^,]+)(?=,|$)/
    );

    const scaleMatch = decoded.match(
      /(?:^|,)scale:([^,]+)(?=,|$)/
    );

    if (!centerMatch || !scaleMatch) {
      return null;
    }

    const centerX = Number(centerMatch[1]);
    const centerY = Number(centerMatch[2]);
    const wkid = Math.round(Number(centerMatch[3]));
    const scale = Number(scaleMatch[1]);

    if (
      !Number.isFinite(centerX) ||
      !Number.isFinite(centerY) ||
      !Number.isFinite(wkid) ||
      !Number.isFinite(scale) ||
      scale <= 0
    ) {
      return null;
    }

    return {
      centerX,
      centerY,
      wkid,
      scale
    };
  }

  function webMercatorToWgs84(x, y) {
    const maxMercator = 20037508.342789244;

    const clampedY = Math.max(
      -maxMercator,
      Math.min(maxMercator, y)
    );

    let longitude =
      x / WEB_MERCATOR_RADIUS * 180 / Math.PI;

    longitude =
      (((longitude + 180) % 360) + 360) % 360 - 180;

    const latitude =
      (
        2 * Math.atan(
          Math.exp(clampedY / WEB_MERCATOR_RADIUS)
        ) -
        Math.PI / 2
      ) *
      180 /
      Math.PI;

    return {
      longitude,
      latitude
    };
  }

  function mapStateToExtent(mapState, widthPx, heightPx) {
    if (!mapState) return null;

    if (
      !Number.isFinite(widthPx) ||
      !Number.isFinite(heightPx) ||
      widthPx <= 0 ||
      heightPx <= 0
    ) {
      return null;
    }

    if (
      mapState.wkid !== 102100 &&
      mapState.wkid !== 3857
    ) {
      return null;
    }

    const resolution =
      mapState.scale /
      (INCHES_PER_METER * SCREEN_DPI);

    const halfWidth =
      resolution * widthPx / 2;

    const halfHeight =
      resolution * heightPx / 2;

    const west = mapState.centerX - halfWidth;
    const south = mapState.centerY - halfHeight;
    const east = mapState.centerX + halfWidth;
    const north = mapState.centerY + halfHeight;

    const southwest =
      webMercatorToWgs84(west, south);

    const northeast =
      webMercatorToWgs84(east, north);

    return {
      xmin: southwest.longitude,
      ymin: southwest.latitude,
      xmax: northeast.longitude,
      ymax: northeast.latitude,
      wkid: 4326,
      source: "mapState"
    };
  }

  const suppliedExtent =
    params.get("extent") ||
    params.get("bbox");

  const suppliedMapState =
    params.get("mapState") ||
    params.get("widget_1");

  let ext = parseExtent(suppliedExtent);

  if (!ext && suppliedMapState) {
    const mapState = parseMapState(suppliedMapState);

    ext = mapStateToExtent(
      mapState,
      MAP_WIDTH_PX,
      MAP_HEIGHT_PX
    );
  }

  console.log("Supplied extent:", suppliedExtent);
  console.log("Supplied mapState:", suppliedMapState);
  console.log("Resolved extent:", ext);

  /* ================= DATA TABLES ================= */

  const COLORS = {
    "G":"#FBF7EE","mG":"#B5D0EB","msG":"#EEDCB0",
    "sG":"#FBE4B4","gM":"#74ACE5","gmS":"#E2C374",
    "gS":"#FAD27B","(g)M":"#4D87D0","(g)sM":"#51A0E5",
    "(g)mS":"#DCB754","(g)S":"#FAC95A","M":"#1565C0",
    "sM":"#0388E0","mS":"#D4A600","S":"#FFC107",
    "gsM":"#75B5EA","(s)gM":"#6F9FD9","cS":"#FF8A00",
    "zS":"#E7BD00","sC":"#F54CCA","sZ":"#B5BD00",
    "C":"#C400E8","Z":"#7BC950","cZ":"#E28C00",
    "zC":"#DA4DE4","czS":"#FF9D00","scZ":"#F58C00",
    "szC":"#FF53A8"
  };

  const NAMES = {
    "S":"Sand","mS":"Muddy sand","sM":"Sandy mud","M":"Mud",
    "(g)S":"Slightly gravelly sand",
    "(g)mS":"Slightly gravelly muddy sand",
    "(g)sM":"Slightly gravelly sandy mud",
    "(g)M":"Slightly gravelly mud",
    "gS":"Gravelly sand","gmS":"Gravelly muddy sand",
    "gM":"Gravelly mud","sG":"Sandy gravel",
    "msG":"Muddy sandy gravel","mG":"Muddy gravel","G":"Gravel",
    "zS":"Silty sand","cS":"Clayey sand","sZ":"Sandy silt",
    "sC":"Sandy clay","Z":"Silt","C":"Clay",
    "cZ":"Clayey silt","zC":"Silty clay",
    "czS":"Clayey silty sand","scZ":"Sandy clayey silt",
    "szC":"Sandy silty clay","gsM":"Gravelly sandy mud",
    "(s)gM":"Slightly sandy gravelly mud"
  };

  const EXTENDED =
    new Set(["cZ","zC","czS","scZ","szC","gsM","(s)gM"]);

  const SRC = {
    E:"extracted from lab analyses",
    P:"parsed from a written description",
    C:"calculated by dbSEABED"
  };

  /* ================= STATE ================= */

  let mode =
    params.get("mode") === "ssc"
      ? "ssc"
      : "gsm";

  let samples = [];
  let total = 0;
  let selected = null;
  let loading = true;

  const colorBy =
    params.get("colorBy") === "computed"
      ? "computed"
      : "stored";

  document.getElementById("onlyBad").checked =
    params.get("onlyBad") === "1";

  const countEl = document.getElementById("count");
  const infoEl = document.getElementById("info");
  const svg = document.getElementById("tern");

  if (ext) {
    document.getElementById("where").textContent =
      `Extent: ${ext.xmin.toFixed(3)}, ${ext.ymin.toFixed(3)} ` +
      `to ${ext.xmax.toFixed(3)}, ${ext.ymax.toFixed(3)}`;
  }

  /* ================= TERNARY GEOMETRY ================= */

  const NS = "http://www.w3.org/2000/svg";

  const T = [300,40];
  const BL = [50,473];
  const BR = [550,473];

  const xy = (top,left,right) => [
    top*T[0] + left*BL[0] + right*BR[0],
    top*T[1] + left*BL[1] + right*BR[1]
  ];

  const onRay = (a,r) =>
    xy(a,(1-a)*(1-r),(1-a)*r);

  const pointText = point =>
    point.map(value => value.toFixed(2)).join(",");

  function el(name, attributes, parent, text) {
    const element = document.createElementNS(NS,name);

    for (const key in attributes) {
      element.setAttribute(key,attributes[key]);
    }

    if (text != null) {
      element.textContent = text;
    }

    if (parent) {
      parent.appendChild(element);
    }

    return element;
  }

  const GSM = {
    corners:["Gravel","Mud","Sand"],
    hlines:[[.05,"5%"],[.30,"30%"],[.80,"80%"]],
    rays:[[.1,.05,"1:9"],[.5,.80,"1:1"],[.9,.80,"9:1"]],
    labels:[
      ["G",.9,.5],["mG",.55,.25],["msG",.55,.7],
      ["sG",.55,.95,1],["gM",.17,.25],["gmS",.17,.7],
      ["gS",.165,.955,1]
    ],
    base:[
      ["(g)M",.05],["(g)sM",.3],
      ["(g)mS",.7],["(g)S",.95]
    ],
    regions:[
      ["G",.8,1,0,1],["mG",.3,.8,0,.5],
      ["msG",.3,.8,.5,.9],["sG",.3,.8,.9,1],
      ["gM",.05,.3,0,.5],["gmS",.05,.3,.5,.9],
      ["gS",.05,.3,.9,1],["(g)M",0,.05,0,.1],
      ["(g)sM",0,.05,.1,.5],["(g)mS",0,.05,.5,.9],
      ["(g)S",0,.05,.9,1]
    ]
  };

  const SSC = {
    corners:["Sand","Clay","Silt"],
    hlines:[[.10,"10%"],[.50,"50%"],[.90,"90%"]],
    rays:[[1/3,.90,"1:2"],[2/3,.90,"2:1"]],
    labels:[
      ["S",.95,.5],["cS",.7,1/6],["mS",.7,.5],
      ["zS",.7,5/6],["sC",.3,1/6],["sM",.3,.5],
      ["sZ",.3,5/6],["C",.05,1/6],["M",.05,.5],
      ["Z",.05,5/6]
    ],
    base:[],
    regions:[
      ["S",.9,1,0,1],["cS",.5,.9,0,1/3],
      ["mS",.5,.9,1/3,2/3],["zS",.5,.9,2/3,1],
      ["sC",.1,.5,0,1/3],["sM",.1,.5,1/3,2/3],
      ["sZ",.1,.5,2/3,1],["C",0,.1,0,1/3],
      ["M",0,.1,1/3,2/3],["Z",0,.1,2/3,1]
    ]
  };

  function classify(g,s,m) {
    const totalValue = g+s+m;

    if (totalValue <= 0) return null;

    g = g/totalValue*100;
    s = s/totalValue*100;
    m = m/totalValue*100;

    const ratio = s+m > 0 ? s/(s+m) : .5;

    if (g >= 80) return "G";
    if (g >= 30) return ratio < .5 ? "mG" : ratio < .9 ? "msG" : "sG";
    if (g >= 5) return ratio < .5 ? "gM" : ratio < .9 ? "gmS" : "gS";

    const base =
      ratio < .1 ? "M" :
      ratio < .5 ? "sM" :
      ratio < .9 ? "mS" : "S";

    return (g > 0 ? "(g)" : "") + base;
  }

  function whyDifferent(point) {
    if (!point.code || point.code === point.expected) return null;

    if (EXTENDED.has(point.code)) {
      return "usSEABED extended code with no published triangle region.";
    }

    return "The stored Folk code differs from the class calculated from these percentages.";
  }

  function position(point) {
    if (mode === "gsm") {
      const totalValue = point.g + point.s + point.m;

      return totalValue > 0
        ? xy(point.g/totalValue,point.m/totalValue,point.s/totalValue)
        : null;
    }

    if (point.c == null || point.c > point.m) return null;

    const totalValue = point.s + point.m;

    return totalValue > 0
      ? xy(point.s/totalValue,point.c/totalValue,(point.m-point.c)/totalValue)
      : null;
  }

  const isNumber = value =>
    typeof value === "number" &&
    Number.isFinite(value) &&
    value >= 0;

  const escapeHtml = value =>
    String(value).replace(
      /[&<>"]/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[character])
    );

  /* ================= DRAWING ================= */

  function drawFrame(definition) {
    svg.innerHTML = "";

    definition.regions.forEach(([code,a1,a2,r1,r2]) => {
      const polygon = el(
        "polygon",
        {
          points:[
            onRay(a1,r1),
            onRay(a1,r2),
            onRay(a2,r2),
            onRay(a2,r1)
          ].map(pointText).join(" "),
          class:"region",
          fill:COLORS[code] || "#9aa3a6"
        },
        svg
      );

      el("title",{},polygon,`${NAMES[code] || code} (${code})`);
    });

    definition.hlines.forEach(([a,label]) => {
      const start = xy(a,1-a,0);
      const end = xy(a,0,1-a);

      el("line",{
        x1:start[0],y1:start[1],
        x2:end[0],y2:end[1],
        class:"bnd"
      },svg);

      el("text",{
        x:start[0]-8,
        y:start[1]+4,
        class:"tick",
        "text-anchor":"end"
      },svg,label);
    });

    definition.rays.forEach(([ratio,max,label]) => {
      const start = xy(0,1-ratio,ratio);
      const end = onRay(max,ratio);

      el("line",{
        x1:start[0],y1:start[1],
        x2:end[0],y2:end[1],
        class:"bnd"
      },svg);

      el("text",{
        x:start[0],
        y:start[1]+16,
        class:"tick",
        "text-anchor":"middle"
      },svg,label);
    });

    el("polygon",{
      points:[T,BL,BR].map(pointText).join(" "),
      class:"edge"
    },svg);

    el("text",{
      x:T[0],y:T[1]-12,
      class:"corner",
      "text-anchor":"middle"
    },svg,definition.corners[0]);

    el("text",{
      x:BL[0],y:BL[1]+34,
      class:"corner",
      "text-anchor":"middle"
    },svg,definition.corners[1]);

    el("text",{
      x:BR[0],y:BR[1]+34,
      class:"corner",
      "text-anchor":"middle"
    },svg,definition.corners[2]);

    definition.labels.forEach(([code,a,ratio,small]) => {
      const point = onRay(a,ratio);

      el("text",{
        x:point[0],
        y:point[1],
        class:"cls" + (small ? " sm" : "")
      },svg,code);
    });

    definition.base.forEach(([code,ratio]) => {
      const point = xy(0,1-ratio,ratio);

      el("text",{
        x:point[0],
        y:point[1]+36,
        class:"cls sm"
      },svg,code);
    });

    return el("g",{},svg);
  }

  function describe(point,count) {
    const source = SRC[(point.dataTypes || "")[8]];

    return (
      `<b>${escapeHtml(point.name || "Sample " + point.objectId)}</b><br>` +
      `Folk code ${escapeHtml(point.code || "none")}` +
      `${NAMES[point.code] ? " – " + escapeHtml(NAMES[point.code]) : ""}` +
      `${source ? " (" + source + ")" : ""}<br>` +
      `Gravel ${point.g}%, sand ${point.s}%, mud ${point.m}%` +
      `${point.c != null ? `, clay ${point.c}%` : ""}<br>` +
      (
        point.reason
          ? `<b>Calculated class: ${escapeHtml(point.expected)}.</b> ${escapeHtml(point.reason)}`
          : "Matches the class calculated from its percentages."
      ) +
      (
        count > 1
          ? `<br><i>${count.toLocaleString()} samples share these values.</i>`
          : ""
      )
    );
  }

  function draw() {
    const group = drawFrame(mode === "gsm" ? GSM : SSC);
    const onlyBad = document.getElementById("onlyBad").checked;
    const groups = new Map();

    samples.forEach(point => {
      if (onlyBad && !point.reason) return;

      const coordinates = position(point);
      if (!coordinates) return;

      const colorKey =
        colorBy === "computed"
          ? point.expected
          : point.code;

      const groupKey =
        `${coordinates[0].toFixed(1)},` +
        `${coordinates[1].toFixed(1)},${colorKey}`;

      if (!groups.has(groupKey)) {
        groups.set(groupKey,{
          coordinates,
          colorKey,
          points:[]
        });
      }

      groups.get(groupKey).points.push(point);
    });

    [...groups.values()]
      .sort((a,b) => b.points.length-a.points.length)
      .forEach(plotGroup => {
        const count = plotGroup.points.length;

        const isSelected =
          plotGroup.points.some(
            point => point.objectId === selected
          );

        const circle = el(
          "circle",
          {
            cx:plotGroup.coordinates[0].toFixed(2),
            cy:plotGroup.coordinates[1].toFixed(2),
            r:(
              Math.min(15,3.6+1.4*Math.sqrt(count-1)) +
              (isSelected ? 2.5 : 0)
            ).toFixed(2),
            fill:COLORS[plotGroup.colorKey] || "#9aa3a6",
            class:"pt" + (isSelected ? " sel" : ""),
            tabindex:0
          },
          group
        );

        const show = () => {
          infoEl.innerHTML =
            describe(plotGroup.points[0],count);
        };

        circle.addEventListener("mouseenter",show);
        circle.addEventListener("focus",show);

        circle.addEventListener("click",() => {
          selected = plotGroup.points[0].objectId;
          show();
          draw();
        });
      });

    if (!loading) {
      countEl.textContent =
        samples.length
          ? `${samples.length.toLocaleString()} samples`
          : "No samples with grain-size values in this extent.";
    }
  }

  /* ================= FEATURE SERVICE QUERY ================= */

  function queryUrl(extra) {
    const query = new URLSearchParams(
      Object.assign(
        {
          where:"1=1",
          geometry:[
            ext.xmin,
            ext.ymin,
            ext.xmax,
            ext.ymax
          ].map(value => +value.toFixed(8)).join(","),
          geometryType:"esriGeometryEnvelope",
          inSR:String(ext.wkid),
          spatialRel:"esriSpatialRelIntersects",
          f:"json"
        },
        extra
      )
    );

    return `${LAYER_URL}/query?${query}`;
  }

  async function getJson(url) {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    if (json.error) {
      throw new Error(json.error.message || "ArcGIS query error");
    }

    return json;
  }

  async function load() {
    try {
      countEl.classList.remove("err");
      countEl.textContent = "Loading samples…";

      const countResponse = await getJson(
        queryUrl({returnCountOnly:"true"})
      );

      total = countResponse.count || 0;

      const rows = [];

      for (
        let offset=0;
        offset<Math.min(total,MAX_FETCH);
        offset+=PAGE
      ) {
        const response = await getJson(
          queryUrl({
            outFields:FIELDS,
            returnGeometry:"false",
            orderByFields:"OBJECTID",
            resultOffset:String(offset),
            resultRecordCount:String(PAGE)
          })
        );

        response.features.forEach(feature => {
          rows.push(feature.attributes);
        });

        if (
          !response.exceededTransferLimit &&
          response.features.length < PAGE
        ) {
          break;
        }
      }

      samples = [];

      rows.forEach(attributes => {
        if (
          isNumber(attributes.Gravel) &&
          isNumber(attributes.Sand) &&
          isNumber(attributes.Mud) &&
          attributes.Gravel +
          attributes.Sand +
          attributes.Mud > 0
        ) {
          const point = {
            objectId:attributes.OBJECTID,
            name:attributes.LocnName,
            code:attributes.FolkCde,
            g:attributes.Gravel,
            s:attributes.Sand,
            m:attributes.Mud,
            c:isNumber(attributes.Clay)
              ? attributes.Clay
              : null,
            dataTypes:attributes.DataTypes,
            date:attributes.ObsvnDate,
            depth:attributes.WaterDepth
          };

          point.expected =
            classify(point.g,point.s,point.m);

          point.reason =
            whyDifferent(point);

          samples.push(point);
        }
      });

      loading = false;
      draw();

    } catch (error) {
      console.error("Feature query failed:",error);

      loading = false;
      countEl.classList.add("err");

      countEl.textContent =
        "The samples could not be loaded. Check the URL parameter and Feature Service request.";

      drawFrame(mode === "gsm" ? GSM : SSC);
    }
  }

  /* ================= CONTROLS ================= */

  function setMode(newMode) {
    mode = newMode;

    document.getElementById("tGSM")
      .classList.toggle("on",newMode === "gsm");

    document.getElementById("tSSC")
      .classList.toggle("on",newMode === "ssc");

    draw();
  }

  document.getElementById("tGSM")
    .addEventListener("click",() => setMode("gsm"));

  document.getElementById("tSSC")
    .addEventListener("click",() => setMode("ssc"));

  document.getElementById("onlyBad")
    .addEventListener("change",draw);

  /* ================= INITIALIZE ================= */

  setMode(mode);

  if (ext) {
    load();
  } else {
    loading = false;
    countEl.classList.add("err");

    countEl.textContent =
      "Unable to plot: no valid extent or mapState was provided.";

    drawFrame(mode === "gsm" ? GSM : SSC);
  }

})();
</script>

</body>
</html>
